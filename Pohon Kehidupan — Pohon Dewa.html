<style>
:root{

  --ff-d:'Cinzel',Georgia,serif; --ff-b:'EB Garamond',Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; min-height:100vh; color:var(--ink); font-family:var(--ff-b); font-size:17px; overflow-x:hidden;

#kunang{position:fixed; inset:0; z-index:3; pointer-events:none}
.bulan{position:fixed; top:6%; right:8%; width:120px; height:120px; border-radius:50%; z-index:0; pointer-events:none;

.kabut{position:fixed; z-index:2; pointer-events:none; border-radius:50%; filter:blur(34px); opacity:.13;
  background:radial-gradient(closest-side, rgba(220,200,150,.8), transparent 72%); animation:kabutGerak 46s ease-in-out infinite alternate}

.gugur{position:fixed; top:-40px; z-index:3; pointer-events:none; opacity:.5; font-size:18px; animation:gugur linear infinite}
@keyframes gugur{ to{transform:translateY(112vh) rotate(340deg)} }
.topbar{position:sticky; top:0; z-index:40; background:rgba(5,7,15,.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.top-in{max-width:1240px; margin:0 auto; padding:12px 22px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.kembali{display:inline-flex; align-items:center; gap:8px; text-decoration:none; padding:9px 16px; border-radius:999px;
  border:1px solid var(--line); color:var(--ink); font-family:var(--ff-d); font-size:12px; letter-spacing:.12em; text-transform:uppercase}
.kembali:hover{color:var(--marble); border-color:var(--line-2)}
.judul{flex:1; min-width:200px}
.judul h1{margin:0; font-family:var(--ff-d); font-size:clamp(18px,3vw,26px); letter-spacing:.08em; color:var(--gold-2)}
.judul p{margin:2px 0 0; font-size:13.5px; font-style:italic; color:var(--ink-2)}
.alat{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.zoombtn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line-2); background:transparent;
  color:var(--gold-2); font-size:18px; cursor:pointer; display:grid; place-items:center}
.zoombtn:hover{background:rgba(212,175,55,.14)}
.tgl{display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-2); cursor:pointer;

.tgl input{accent-color:var(--gold)}
.cari{position:relative}
.cari input{padding:9px 14px 9px 36px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05);

.cari input:focus{border-color:var(--line-2); box-shadow:0 0 0 4px rgba(212,175,55,.12)}

.panggung{position:relative; z-index:2; max-width:1400px; margin:0 auto; padding:10px 18px 60px}
.legenda{display:flex; gap:8px 16px; flex-wrap:wrap; justify-content:center; margin:14px 0 6px; font-size:13px; color:var(--ink-2)}
.gulung{overflow:auto; border:1px solid var(--line); border-radius:20px; scrollbar-width:thin;

#pohonZoom{transform-origin:0 0}
#pohonSvg{display:block}
.buah{cursor:pointer}
.buah .cahaya{animation:buahNapas 4s ease-in-out infinite}
@keyframes buahNapas{ 0%,100%{opacity:.3} 50%{opacity:.55} }
.buah .inti{transition:all .25s ease}
.buah:hover .halo, .buah.pilih .halo{filter:drop-shadow(0 0 14px currentColor)}
.buah text{display:none; font-family:var(--ff-d); fill:#f2e7c9; paint-order:stroke; stroke:#060913; stroke-width:4px}

.buah.pilih .halo{stroke:var(--gold-2); stroke-width:2.5}
.tajuk-goyang{animation:tajukGoyang 13s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 100%}

.daun-goyang{animation:daunGoyang 6s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center}

#tip{position:fixed; z-index:60; pointer-events:none; display:none; text-align:center;

.panel{position:fixed; z-index:50; background:linear-gradient(180deg,#141b3a,#0b1028); border:1px solid var(--line-2);

.panel[hidden]{display:none}
.panel .tutup{position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--line-2); background:transparent; color:var(--ink); cursor:pointer; font-size:16px}
.panel h2{margin:0; font-size:26px; color:var(--marble); font-weight:600}
.panel .ep{font-style:italic; color:var(--gold-2); margin:4px 0 2px}
.panel .rn{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); margin:0 0 12px}
.panel dl{margin:0; display:grid; gap:10px; font-size:14px}
.panel dt{font-family:var(--ff-d); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold)}
.panel dd{margin:2px 0 0; color:var(--ink)}
.kerabat{display:flex; flex-wrap:wrap; gap:7px; margin-top:6px}
.kerabat span{cursor:pointer; font-size:13px; padding:4px 12px; border-radius:999px; border:1px solid var(--line);

.kerabat span:hover{background:rgba(212,175,55,.22)}
.kisah{display:block; text-align:center; margin-top:16px; padding:12px; border-radius:12px; text-decoration:none;
  font-family:var(--ff-d); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#1a1408;
  background:linear-gradient(180deg,#efdfae,#c9a45c)}
.kisah:hover{filter:brightness(1.08)}
.pil{position:fixed; z-index:50; left:50%; bottom:18px; transform:translateX(-50%); font-size:13px; font-style:italic;
  color:var(--ink-2); background:rgba(5,7,15,.72); padding:8px 18px; border-radius:999px; border:1px solid var(--line); white-space:nowrap}
@media (max-width:760px){ .panel{left:12px; right:12px; top:auto; bottom:12px; width:auto; max-height:46vh} .cari input{width:150px} }
.buah{transition:transform .25s ease, opacity .3s ease; transform-box:fill-box; transform-origin:center}
.buah:hover{transform:scale(1.28)}
.buah.redup{opacity:.14}
.nebula{position:fixed; z-index:0; pointer-events:none; filter:blur(70px); opacity:.14; border-radius:50%}
.nadi{animation:nadiP 3.2s ease-in-out infinite}
@keyframes nadiP{ 0%,100%{opacity:.9} 50%{opacity:.3} }
@media (prefers-reduced-motion:reduce){

}
</style>

  [[-42, 1160, 800], [6, 1180, 780], [46, 1150, 820]].forEach(function(v, vi){

  /* dahan utama simetris */

      + '" stroke="#3a2b1a" stroke-width="' + (16 - Math.abs(i) * 2) + '" fill="none" stroke-linecap="round"/>';

  s += '<g class="tajuk-goyang">';

  function daun(x, y){
    var vsz = 9 + rnd() * 11;

    return '<ellipse cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" rx="' + vsz.toFixed(0) + '" ry="' + (vsz * 0.55).toFixed(0)

      + '" transform="rotate(' + (rnd() * 180).toFixed(0) + ' ' + x.toFixed(0) + ' ' + y.toFixed(0) + '"' + gy + '/>';
  }
  for(i = 0; i < 190; i++){
    var lx = 330 + rnd() * 840, ly = 150 + rnd() * 620;
    if(((lx - 750) / 480) * ((lx - 750) / 480) + ((ly - 480) / 380) * ((ly - 480) / 380) > 1) continue;
    s += daun(lx, ly);
    s += daun(1500 - lx + (rnd() - 0.5) * 30, ly + (rnd() - 0.5) * 30);
  }
  /* slot buah: baris rapi di dalam lingkaran tajuk, generasi muda di atas */
  var atas = TREEDATA.filter(function(g){ return DALAM[g.n] >= 2; })

  var slot = [], yy;
  var NKOL = 13;
  function kolomX(ci){ return 750 + (ci - (NKOL - 1) / 2) * 72; }
  for(yy = 170; yy <= 1010 && slot.length < atas.length + 12; yy += 64){

    for(var k = 0; k < n && slot.length < atas.length + 12; k++){

  var akarX = [-560, -380, -190, -60, 60, 190, 380, 560, -470, -280, 280, 470, -90, 90, -650, 650];

    var nama = g.n.length > 14 ? g.n.slice(0, 13) + '…' : g.n;

      + '<circle class="cahaya" cx="' + g._x.toFixed(0) + '" cy="' + g._y.toFixed(0) + '" r="21" fill="' + g.c + '" style="animation-delay:-' + (gi % 4) + 's"/>'

}
/* kerabat untuk peredupan */
function kinSet(nama){
  var set = {};
  set[nama] = 1;
  function byN(n){ for(var k = 0; k < TREEDATA.length; k++) if(TREEDATA[k].n === n) return TREEDATA[k]; return null; }
  var tump = [byN(nama)], c;
  while(tump.length){
    c = tump.pop(); if(!c) continue;
    pecah(c.o).forEach(function(p){ if(!set[p.n]){ set[p.n] = 1; tump.push(p); } });
  }
  var t2 = [nama];
  while(t2.length){
    var cn = t2.pop();
    (ANAKMAP[cn] || []).forEach(function(ch){ if(!set[ch.n]){ set[ch.n] = 1; t2.push(ch.n); } });
  }
  return set;
}
function terapkanRedup(nama){
  if(!nama){ $$('.buah.redup').forEach(function(o){ o.classList.remove('redup'); }); return; }
  var set = kinSet(nama);
  $$('.buah').forEach(function(o){ o.classList.toggle('redup', !set[o.getAttribute('data-n')]); });
}
/* garis keturunan menyala */
function garisKeturunan(nama, sementara){
  var host = document.getElementById('garisSil');
  if(!host) return;
  host.innerHTML = '';
  if(!nama) return;
  function byN(n){ for(var k = 0; k < TREEDATA.length; k++) if(TREEDATA[k].n === n) return TREEDATA[k]; return null; }
  var atas = {}, i;
  var tump = [byN(nama)];
  while(tump.length){
    var c = tump.pop();
    if(!c) continue;
    pecah(c.o).forEach(function(p){
      if(p === c || !POS[p.n] || !POS[c.n]) return;
      atas[p.n + '>' + c.n] = [p, c];
      tump.push(p);
    });
  }
  var s = '', kunci;
  for(kunci in atas){
    var a = atas[kunci][0], b2 = atas[kunci][1];
    var x1 = POS[a.n].x, y1 = POS[a.n].y, x2 = POS[b2.n].x, y2 = POS[b2.n].y;
    s += '<path d="M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + ((y1 + y2) / 2) + ' ' + x2 + ' ' + ((y1 + y2) / 2) + ' ' + x2 + ' ' + y2 + '" fill="none" stroke="rgba(242,221,166,.75)" stroke-width="2.5"/>';
  }
  (ANAKMAP[nama] || []).forEach(function(ch){
    if(!POS[nama] || !POS[ch.n]) return;
    var x1 = POS[nama].x, y1 = POS[nama].y, x2 = POS[ch.n].x, y2 = POS[ch.n].y;
    s += '<path d="M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + ((y1 + y2) / 2) + ' ' + x2 + ' ' + ((y1 + y2) / 2) + ' ' + x2 + ' ' + y2 + '" fill="none" stroke="rgba(143,214,168,.6)" stroke-width="2"/>';
  });
  host.innerHTML = s;
}
function bukaPanel(nama){
  var g = null, i;
  for(i = 0; i < TREEDATA.length; i++){ if(TREEDATA[i].n === nama) g = TREEDATA[i]; }
  if(!g) return;
  $$('.buah.pilih').forEach(function(b){ b.classList.remove('pilih'); });
  var nd = document.querySelector('.buah[data-n="' + nama.replace(/"/g, '') + '"]');
  if(nd) nd.classList.add('pilih');
  var ortu = pecah(g.o), anak = pecah(g.a);
  var h = '<h2><span style="color:' + g.c + '">●</span> ' + esc(g.n) + '</h2>'
    + '<p class="ep">' + esc(g.e) + '</p><p class="rn">' + esc(g.d) + ' · Generasi ke-' + (DALAM[g.n] + 1) + ' · ' + esc(GRUPNAMA[g.g] || '') + '</p>'
    + '<dl><div><dt>Tempat</dt><dd>' + esc(g.home) + '</dd></div>'
    + '<div><dt>Pasangan</dt><dd>' + esc(g.s) + '</dd></div>'
    + (ortu.length ? '<div><dt>Orang tua</dt><dd><div class="kerabat">' + ortu.map(function(p){ return '<span data-n="' + esc(p.n) + '">' + esc(p.n) + '</span>'; }).join('') + '</div></dd></div>' : '')
    + (anak.length ? '<div><dt>Anak</dt><dd><div class="kerabat">' + anak.slice(0, 12).map(function(p){ return '<span data-n="' + esc(p.n) + '">' + esc(p.n) + '</span>'; }).join('') + '</div></dd></div>' : '')
    + '</dl><a class="kisah" href="Panteon — Ensiklopedia Dewa-Dewi Yunani.html#dewa=' + slug(g.n) + '">Baca kisah lengkap →</a>';
  document.getElementById('panelIsi').innerHTML = h;
  document.getElementById('panel').hidden = false;
  garisKeturunan(nama);
  terapkanRedup(nama);
  document.getElementById('tip').style.display = 'none';
  $$('#panelIsi .kerabat span').forEach(function(sp){
    sp.addEventListener('click', function(){ lompat(sp.getAttribute('data-n')); });
  });
}
function lompat(nama){
  bukaPanel(nama);
  var nd = document.querySelector('.buah[data-n="' + nama.replace(/"/g, '') + '"]');
  if(!nd) return;
  try{
    var r = nd.getBoundingClientRect(), gr = document.getElementById('gulung').getBoundingClientRect();
    document.getElementById('gulung').scrollBy({ left: r.left - gr.left - gr.width / 2, top: r.top - gr.top - gr.height / 2, behavior: 'smooth' });
  }catch(e){}
}
document.getElementById('panelTutup').addEventListener('click', function(){
  document.getElementById('panel').hidden = true;
  garisKeturunan(null);
  terapkanRedup(null);
  $$('.buah.pilih').forEach(function(b){ b.classList.remove('pilih'); });
});
document.addEventListener('keydown', function(e){

    document.getElementById('panelTutup').click();

});
document.getElementById('tglNama').addEventListener('change', function(){

});
document.getElementById('qcari').addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;

  if(!q) return;

    if(nrm(TREEDATA[i].n).indexOf(q) > -1){ lompat(TREEDATA[i].n); return; }

});
var skala = 1;
function terapkanZoom(){ document.getElementById('pohonZoom').style.transform = 'scale(' + skala + ')'; }
document.getElementById('zIn').addEventListener('click', function(){ skala = Math.min(1.6, skala + 0.15); terapkanZoom(); });

(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c = document.getElementById('kunang'), x = c.getContext('2d'), arr = [], i;
  function atur(){
    c.width = innerWidth; c.height = innerHeight;
    arr = [];
    for(i = 0; i < 46; i++) arr.push({ x: Math.random() * c.width, y: Math.random() * c.height,
      r: 0.6 + Math.random() * 1.6, vy: 0.08 + Math.random() * 0.3, ph: Math.random() * 6.28, sp: 0.01 + Math.random() * 0.03 });
  }
  atur();
  addEventListener('resize', atur);
  (function loop(){
    requestAnimationFrame(loop);
    x.clearRect(0, 0, c.width, c.height);

      var p = arr[i];
      p.y -= p.vy; p.ph += p.sp;

  })();
})();

})();
